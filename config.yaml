server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s

routes:
  - id: auth_service
    path: /api/v1/auth
    methods: ["POST"]
    backends:
      - url: "http://localhost:8081"
  - id: user_service
    path: /api/v1/users
    methods: ["GET", "POST"]
    backends:
      - url: "http://localhost:8082"