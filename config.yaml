server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  trust_proxy_headers: false
  max_body_bytes: 1048576

routes:
  - id: auth_service
    path: /api/v1/auth
    methods: ["POST"]
    backends:
      - url: "http://localhost:8081"
    rate_limit:
      enabled: true
      rate: 0.2      
      capacity: 5
      fail_closed: true  
    circuit_breaker:
      enabled: true
      max_requests: 1
      interval: 10
      timeout: 15
    timeout:
      response_header: 5s
  - id: user_service
    path: /api/v1/users
    methods: ["GET", "POST"]
    backends:
      - url: "http://localhost:8082"
    middlewares: ["jwt"]
    rate_limit:
      enabled: true
      rate: 1      
      capacity: 2
      fail_closed: false 
    circuit_breaker:
      enabled: true
      max_requests: 1
      interval: 10
      timeout: 15
    timeout:
      response_header: 8s  